<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Import Contacts</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
        }

        .container {
            max-width: 550px;
            margin: 60px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #ff6b00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #555;
            text-decoration: none;
        }

        .format {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="box">

            <h1>📥 Import Contacts</h1>

            <p>
                Upload a CSV file to add multiple contacts at once.
            </p>

            <div class="format">

                <strong>CSV Format:</strong><br>

                Name,Mobile,Category<br>

                Rahul,9876543210,Customer<br>

                Amit,9876543211,Student<br>

                Priya,9876543212,General

            </div>


            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <input
                    type="file"
                    name="file"
                    accept=".csv"
                    required
                >

                <button type="submit">
                    📥 Import Contacts
                </button>

            </form>


            <a
                href="/contacts"
                class="back"
            >
                ← Back to Contacts
            </a>

        </div>

    </div>

</body>

</html>
