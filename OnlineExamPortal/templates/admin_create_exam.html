{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2>Create New Question Paper</h2>
    <p>Exam चे नाव, वेळ आणि MCQ प्रश्न सेट कर.</p>

    <form method="POST" action="{{ url_for('create_exam') }}">
        <div class="mb-3">
            <label class="form-label">Exam Name</label>
            <input type="text" name="title" class="form-control"
                   placeholder="उदा. Python Online Exam" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Duration (minutes)</label>
            <input type="number" name="duration" class="form-control"
                   value="30" min="1" required>
        </div>

        <div id="questionsContainer"></div>

        <button type="button" class="btn btn-secondary mb-3"
                onclick="addQuestion()">
            + Add Question
        </button>

        <hr>

        <button type="submit" class="btn btn-primary">
            Save Question Paper
        </button>

        <a href="{{ url_for('admin_dashboard') }}"
           class="btn btn-outline-secondary">
            Cancel
        </a>
    </form>
</div>

<script>
let questionCount = 0;

function addQuestion() {
    questionCount++;

    const div = document.createElement("div");
    div.className = "card shadow-sm p-3 mb-3";

    div.innerHTML = `
        <h5>Question ${questionCount}</h5>

        <label class="form-label">Question</label>
        <textarea name="question_text[]" class="form-control mb-2"
                  required></textarea>

        <label class="form-label">Option A</label>
        <input name="option_a[]" class="form-control mb-2" required>

        <label class="form-label">Option B</label>
        <input name="option_b[]" class="form-control mb-2" required>

        <label class="form-label">Option C</label>
        <input name="option_c[]" class="form-control mb-2" required>

        <label class="form-label">Option D</label>
        <input name="option_d[]" class="form-control mb-2" required>

        <label class="form-label">Correct Answer</label>
        <select name="correct_answer[]" class="form-select mb-2" required>
            <option value="">Select correct answer</option>
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>
        </select>

        <label class="form-label">Marks</label>
        <input type="number" name="marks[]" class="form-control mb-3"
               value="1" min="1" required>

        <button type="button" class="btn btn-outline-danger"
                onclick="this.parentElement.remove()">
            Remove Question
        </button>
    `;

    document.getElementById("questionsContainer").appendChild(div);
}

addQuestion();
</script>
{% endblock %}
